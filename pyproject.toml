[project]
name = "ares"
version = "0.1.0"
description = "ARES: Adaptive Reasoning and Education Study — misconception detection and Socratic question generation"
requires-python = ">=3.11"
dependencies = [
    # ML core
    "torch>=2.3.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.20.0",
    "trl>=0.11.0",
    # Unsloth (install separately — see README for the correct wheel)
    # "unsloth",
    # Tracking
    "wandb>=0.18.0",
    # Inference clients
    "openai>=1.40.0",
    "ollama>=0.3.0",
    # Web UI
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    # Utilities
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
]

[tool.uv]
# Unsloth must be installed with the matching CUDA/torch wheel.
# See README — install it with:
#   uv pip install "unsloth[cu124-torch250] @ https://github.com/unslothai/unsloth/releases/..."
# or simply: pip install unsloth

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
