[project]
name = "ares"
version = "0.1.0"
description = "ARES: Adaptive Reasoning and Education Study"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "datasets>=4.8.4",
    "fastapi>=0.135.2",
    "jinja2>=3.1.6",
    "numpy>=2.4.3",
    "ollama>=0.6.1",
    "openai>=2.30.0",
    "peft>=0.18.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "transformers>=5.4.0",
    "trl>=0.29.1",
    "uvicorn[standard]>=0.42.0",
    "wandb>=0.25.1",
]

[tool.uv]
package = false
